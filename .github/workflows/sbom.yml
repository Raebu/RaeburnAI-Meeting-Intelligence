name: Generate repository SBOM

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/sbom.yml'
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pyproject.toml'
      - '**/requirements*.lock'
      - '**/Dockerfile*'

permissions:
  contents: write
  actions: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Generate SPDX repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.spdx.json
          dependency-snapshot: true
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

      - name: Generate CycloneDX repository SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: ${{ github.event.repository.name }}-${{ github.sha }}.cdx.json
          upload-artifact: true
          upload-artifact-retention: 90
          upload-release-assets: false

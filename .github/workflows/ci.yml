name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API quality, migration and package gates
    if: github.event_name != 'pull_request' || (github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      RAEBURN_ENV: test
      RAEBURN_API_KEY: test-api-key-not-a-production-secret
      RAEBURN_CORS_ORIGINS: http://testserver
      RAEBURN_RATE_LIMIT_PER_MINUTE: "1000"
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      AUTO_CREATE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install pinned API toolchain
        run: python -m pip install -e '.[dev]'
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .
      - name: Strict type check
        run: mypy meeting_intelligence
      - name: Migration upgrade, rollback and re-upgrade
        env:
          AUTO_CREATE_SCHEMA: "false"
        run: |
          rm -f ci.db
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Unit, integration and end-to-end tests
        env:
          DATABASE_URL: sqlite+pysqlite:///:memory:
          AUTO_CREATE_SCHEMA: "true"
        run: pytest
      - name: Build source and wheel distributions
        run: python -m build
      - name: Audit Python dependencies
        run: pip-audit --skip-editable
      - name: Scan tracked files for high-confidence secrets
        working-directory: .
        run: python scripts/check_secrets.py
      - name: Upload coverage and distributions
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-quality-evidence
          path: |
            apps/api/coverage.xml
            apps/api/dist/
          if-no-files-found: warn

  web:
    name: Web lint, typecheck, tests and build
    if: github.event_name != 'pull_request' || (github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.17.1"
      - name: Install exact direct dependency set
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    if: github.event_name != 'pull_request' || (github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

  containers:
    name: Compose, image build and vulnerability scans
    if: github.event_name != 'pull_request' || (github.head_ref == 'production-hardening-persistence-20260726' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: compose-validation-only
        run: docker compose config --quiet
      - name: Build API image
        run: docker build --pull -f apps/api/Dockerfile -t meeting-intelligence-api:${{ github.sha }} .
      - name: Build web image
        run: docker build --pull -f apps/web/Dockerfile -t meeting-intelligence-web:${{ github.sha }} .
      - name: Scan API image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meeting-intelligence-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - name: Scan web image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meeting-intelligence-web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

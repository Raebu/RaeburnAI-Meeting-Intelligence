name: Generate hardening web lockfile

on:
  push:
    branches: [hardening/production-20260824]

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[lockbot]') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/production-20260824
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate lockfile from manifest
        run: npm install --package-lock-only --ignore-scripts
      - name: Audit resolved dependencies
        run: npm audit --audit-level=high
      - name: Commit generated lockfile
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "chore: generate web package lock [lockbot]"
          git push origin HEAD:hardening/production-20260824

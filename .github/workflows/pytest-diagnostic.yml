name: Pytest diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/pytest-diagnostic.yml'
      - 'apps/api/**/*.py'

permissions:
  contents: read

jobs:
  pytest-diagnostic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked test dependencies
        working-directory: apps/api
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Capture exact CI coverage command
        id: tests
        working-directory: apps/api
        env:
          RAEBURN_ENV: test
          RAEBURN_API_KEY: test-api-key-not-a-production-secret
          RAEBURN_CORS_ORIGINS: http://testserver
          RAEBURN_RATE_LIMIT_PER_MINUTE: '1000'
          DATABASE_URL: sqlite+pysqlite:///./diagnostic.db
          AUTO_CREATE_SCHEMA: 'true'
        shell: bash
        run: |
          set +e
          pytest --cov=meeting_intelligence --cov-report=term-missing --cov-fail-under=60 2>&1 | tee pytest-diagnostic.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-pytest-diagnostic
          path: apps/api/pytest-diagnostic.txt
          retention-days: 1
      - name: Report test result
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1

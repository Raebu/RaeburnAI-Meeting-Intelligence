name: Generate dependency locks

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-locks:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.17.1"
          package-manager-cache: false
      - name: Generate npm lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
      - name: Generate hashed Python lockfiles
        run: |
          python -m pip install pip-tools==7.6.1
          cd apps/api
          python -m piptools compile --generate-hashes --resolver=backtracking --output-file=requirements.lock pyproject.toml
          python -m piptools compile --generate-hashes --resolver=backtracking --extra=dev --output-file=requirements-dev.lock pyproject.toml
      - name: Commit generated locks
        run: |
          git add apps/web/package-lock.json apps/api/requirements.lock apps/api/requirements-dev.lock
          if git diff --cached --quiet; then
            echo "Lockfiles already match dependency definitions."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: commit reproducible dependency locks"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: Formatting preview

on:
  pull_request:
    paths:
      - '.github/workflows/format-preview.yml'
      - 'apps/api/**/*.py'

permissions:
  contents: read

jobs:
  format-preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: apps/api/requirements-dev.lock
      - name: Install locked formatter
        working-directory: apps/api
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Format changed API files
        working-directory: apps/api
        run: ruff format meeting_intelligence/main.py meeting_intelligence/native_work.py tests/test_native_api.py
      - name: Stage formatted source artifact
        run: |
          mkdir -p formatted/apps/api/meeting_intelligence formatted/apps/api/tests
          cp apps/api/meeting_intelligence/main.py formatted/apps/api/meeting_intelligence/main.py
          cp apps/api/meeting_intelligence/native_work.py formatted/apps/api/meeting_intelligence/native_work.py
          cp apps/api/tests/test_native_api.py formatted/apps/api/tests/test_native_api.py
      - name: Upload exact formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ruff-formatted-source
          path: formatted/
          retention-days: 1

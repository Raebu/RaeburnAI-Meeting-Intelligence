name: Publish release containers

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish API image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/raebu/raeburnai-meeting-intelligence-api:${{ github.event.release.tag_name }}
            ghcr.io/raebu/raeburnai-meeting-intelligence-api:latest
          provenance: mode=max
          sbom: true
      - name: Publish web image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/raebu/raeburnai-meeting-intelligence-web:${{ github.event.release.tag_name }}
            ghcr.io/raebu/raeburnai-meeting-intelligence-web:latest
          provenance: mode=max
          sbom: true

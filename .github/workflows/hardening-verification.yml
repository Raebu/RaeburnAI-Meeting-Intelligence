name: Hardening verification

# Run hardening checks for every pull request whose head branch belongs to this
# repository. Fork PRs remain excluded so untrusted code cannot reach these
# verification jobs.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hardening-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  api:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/api
    env:
      RAEBURN_ENV: test
      RAEBURN_API_KEY: test-api-key-not-a-production-secret
      RAEBURN_CORS_ORIGINS: http://testserver
      RAEBURN_RATE_LIMIT_PER_MINUTE: "1000"
      DATABASE_URL: sqlite+pysqlite:///./ci.db
      AUTO_CREATE_SCHEMA: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12.13"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Show exact Ruff formatting diff
        run: |
          ruff format .
          git diff -- meeting_intelligence/config.py meeting_intelligence/dispatch_queue.py meeting_intelligence/main.py
          exit 1
      - run: mypy meeting_intelligence
      - name: Migration upgrade, rollback and re-upgrade
        env:
          AUTO_CREATE_SCHEMA: "false"
        run: |
          if [ -f alembic.ini ]; then
            command -v alembic >/dev/null || {
              echo "alembic.ini exists but Alembic is not installed" >&2
              exit 1
            }
            rm -f ci.db
            alembic upgrade head
            alembic downgrade base
            alembic upgrade head
          else
            echo "No Alembic migration assets on this branch; migration round-trip not applicable."
          fi
      - name: Unit, integration and E2E tests
        env:
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          AUTO_CREATE_SCHEMA: "true"
        run: pytest
      - run: python -m build
      - run: pip-audit --skip-editable
      - name: Secret scan
        working-directory: .
        run: python scripts/check_secrets.py

  web:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "22.17.1"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          POSTGRES_PASSWORD=compose-validation-only docker compose config --quiet
      - run: docker build --pull -f apps/api/Dockerfile -t meeting-intelligence-api:${{ github.sha }} .
      - run: docker build --pull -f apps/web/Dockerfile -t meeting-intelligence-web:${{ github.sha }} .
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meeting-intelligence-api:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: meeting-intelligence-web:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

name: PR format autofix

on:
  push:
    branches:
      - autonomous/bound-meeting-lock-state-20260902

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: autonomous/bound-meeting-lock-state-20260902
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install Ruff
        working-directory: apps/api
        run: python -m pip install 'ruff==0.12.1'
      - name: Format changed API files
        working-directory: apps/api
        run: ruff format meeting_intelligence/config.py tests/test_production_config.py
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/meeting_intelligence/config.py apps/api/tests/test_production_config.py
          git commit -m 'Apply Ruff canonical formatting'
          git push

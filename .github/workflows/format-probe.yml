name: Temporary format probe

on:
  push:
    branches:
      - autonomous/production-config-guardrails-20260902

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install formatter
        working-directory: apps/api
        run: python -m pip install 'ruff==0.12.1'
      - name: Apply canonical formatting
        working-directory: apps/api
        run: ruff format meeting_intelligence/config.py tests/test_production_config.py
      - name: Show canonical diff
        run: git diff -- apps/api/meeting_intelligence/config.py apps/api/tests/test_production_config.py
      - name: Upload canonical files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canonical-format
          path: |
            apps/api/meeting_intelligence/config.py
            apps/api/tests/test_production_config.py
          if-no-files-found: error
          retention-days: 1
